name: Tests (no external publication)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate JSON configs
        run: |
          python -m json.tool config/brand.json >/dev/null
          python -m json.tool config/pipeline.json >/dev/null
          python -m json.tool config/content_strategy.json >/dev/null
      - name: Generate sample daily brief (NO Gemini or Instagram calls)
        run: python -m src.daily_brief --date 2026-11-10
